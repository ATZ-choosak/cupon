add('ลำดับการคิดเงินในตะกร้า','overview','<span class="tag">ภาพรวม</span><h2>ในตะกร้าเดียว คิดเงินตามลำดับนี้</h2><div class="flow"><div class="n r"><b>1 · Flash Sale</b>ลดราคาสินค้า</div><span class="ar">→</span><div class="n r"><b>2 · โปรโมชั่น</b>ลูกค้าเลือกเป็นการ์ด</div><span class="ar">→</span><div class="n r"><b>3 · คูปอง</b>คิดจากยอดหลังหักโปร</div><span class="ar">→</span><div class="n r"><b>4 · ค่าจัดส่ง</b></div><span class="ar">→</span><div class="n r"><b>5 · ใช้พอยท์ชำระ</b></div><span class="ar">→</span><div class="n g"><b>ยอดสุทธิ</b>ชำระเงิน</div></div><div class="cols c2" style="margin-top:1.2em"><div class="card"><h3>หลักการร่วมทั้งระบบ</h3><ul><li><b>โปรโมชั่นไม่ต้องใส่โค้ด</b> ส่วนลดเกิดเองเมื่อเข้าเงื่อนไข</li><li><b>คำนวณที่เซิร์ฟเวอร์เสมอ</b> หน้าจอเป็นแค่ตัวอย่าง</li><li><b>ปรับได้จากหน้าแอดมิน</b> ไม่ต้องพัฒนาใหม่</li><li><b>ตรวจย้อนหลังได้</b> ทุกการใช้คูปอง สิทธิ์ลุ้น การแลกพอยท์</li></ul></div><div class="card"><h3>นโยบายร่วม</h3><ul><li>แต่ละโมดูล <b>เปิด/ปิดได้</b> และกำหนดได้ว่าใช้ร่วมกันได้หรือไม่</li><li>ยกเลิก/คืนสินค้า <b>ไม่เรียกคืน</b>คูปอง พอยท์ ของแถมที่ใช้ไปแล้ว</li><li><b>แจ้งเตือนบนเว็บเท่านั้น</b> (ไม่มีอีเมล/SMS/LINE)</li><li>ราคาทั้งหมด <b>รวม VAT</b> แล้ว</li></ul></div></div><div style="margin-top:auto"><a class="chip go" href="../mockup/promotion/09-customer-cart.html" target="_blank" rel="noopener">ดูตะกร้าลูกค้า ↗</a><a class="chip go" href="../mockup/simulator/00-flow.html" target="_blank" rel="noopener">ลองระบบจำลองครบวงจร ↗</a><a class="chip go" href="../mockup/home/01-customer-home.html" target="_blank" rel="noopener">ดูหน้าแรกลูกค้า ↗</a><a class="chip" href="../mockup/home/02-admin-notifications.html" target="_blank" rel="noopener">ตั้งค่าแจ้งเตือน ↗</a></div>');

  add(t.name+' — เชื่อมกับเรื่องอื่น', t.id,

  // screens
  add(t.name+' — ดูหน้าจอ', t.id,
   '<span class="tag">เรื่องที่ '+t.no+' · หน้าจอ</span><h2>'+t.name+': กดดูหน้าจอแต่ละหน้า</h2><p class="lead">เริ่มที่ <b>Flow</b> เพื่อดูภาพรวมขั้นตอน แล้วไล่ฝั่งแอดมิน (ตั้งค่า) และฝั่งลูกค้า (สิ่งที่ลูกค้าเห็น) — ทุกหน้ามีเลขกำกับพร้อมคำอธิบาย</p><div class="card" style="flex:1;overflow:auto">'+chips(t.screens)+'</div><p class="kbd" style="margin-top:.5em">เปิดในแท็บใหม่ · ใช้ปุ่ม “ก่อนหน้า/ถัดไป” ที่แถบดำด้านบนของหน้าจอเพื่อไล่ต่อทั้งโมดูล</p>');
});

add('สรุป','end','<span class="tag">ปิดท้าย</span><h2>สรุปภาพรวม</h2><div class="cols c3" style="align-content:start">'+
 '<div class="card red"><h3>ตั้งครั้งเดียว ใช้ทั่วระบบ</h3><p style="margin:0">กลุ่มลูกค้า/สินค้า และตัวเลือก “ทุกคน/บางคน” ใช้ร่วมกันทุกเรื่อง ไม่ต้องคีย์ซ้ำ</p></div>'+
 '<div class="card red"><h3>ตะกร้าเดียวเป็นจุดรวม</h3><p style="margin:0">โปรโมชั่น → คูปอง → พอยท์ คิดตามลำดับ ลูกค้าเห็นและเลือกเองในตะกร้า คำนวณที่เซิร์ฟเวอร์</p></div>'+
 '<div class="card red"><h3>รางวัลใช้ช่องทางเดิม</h3><p style="margin:0">รางวัลทุกเรื่องไหลเข้ากระเป๋าคูปอง ยอดพอยท์ หรือคิวคำขอรับของ ที่มีอยู่แล้ว</p></div></div>'+
 '<div class="card amber" style="margin-top:1.2em;flex:1"><h3>สิ่งที่อยากให้ลูกค้าช่วยยืนยัน</h3><ul><li>กลุ่มลูกค้า/สินค้า — ใครเป็นผู้ดูแล และข้อมูลตั้งต้นที่จะนำเข้า</li><li>คูปองกระดาษ — เปิดให้ใช้ออนไลน์ได้หรือไม่ · รายชื่อร้าน/สาขาที่ร่วมรายการ · กำหนดส่งก้นเบิกเงิน</li><li>พอยท์ — อัตรารายสินค้าเริ่มต้น และสินค้าที่ตั้งเป็น 0</li><li>แคมเปญ — ยอดสะสมนับก่อน/หลังส่วนลด และปีสัญญา (ปีปฏิทินหรือวันเซ็นแต่ละร้าน)</li><li>สุ่มรางวัล — ผู้ยืนยันกฎหมาย/ภาษี และงบประมาณ</li><li>เซตร้านยา — จำนวนเซตต่อออเดอร์ และราคาในเซต (ตามราคาปัจจุบันหรือล็อกไว้)</li></ul><p class="kbd" style="margin-top:.5em">รายละเอียดข้อที่ต้องตัดสินใจของแต่ละเรื่อง อยู่ใน “หมายเหตุ UX” ใต้แต่ละหน้าจอ และในเอกสารสเปก</p></div><div style="margin-top:.6em"><a class="chip go" href="../mockup/index.html" target="_blank" rel="noopener">เปิดหน้าจอทั้งหมด ↗</a><a class="chip" href="../requirements.html" target="_blank" rel="noopener">เอกสารความต้องการ ↗</a><a class="chip" href="../dev-architecture.html" target="_blank" rel="noopener">สถาปัตยกรรมสำหรับ dev ↗</a></div>');

/* ---------- engine ---------- */
var cur = 0, host = document.getElementById('slides');
host.innerHTML = S.map(function(s,i){ return '<section class="slide" id="s'+i+'">'+s.html+'</section>'; }).join('');
function show(i){
  cur = Math.max(0, Math.min(S.length-1, i));
  Array.prototype.forEach.call(host.children, function(el,k){ el.classList.toggle('on', k===cur); });
  document.getElementById('bar').style.width = ((cur+1)/S.length*100)+'%';
  document.getElementById('pg').textContent = (cur+1)+' / '+S.length;
  document.getElementById('ft').textContent = 'Pharmaplex · '+(S[cur].title||'');
  history.replaceState(null,'','#'+(cur+1));
}
function go(d){ show(cur+d); }
function goIdx(i){ show(i); closeMenu(); }
function goTopic(id){ show(topicStart[id] !== undefined ? topicStart[id] : 0); closeMenu(); }
function toggleMenu(){ document.getElementById('menu').classList.toggle('on'); }
function closeMenu(){ document.getElementById('menu').classList.remove('on'); }
function fs(){ var e=document.documentElement; if(!document.fullscreenElement) e.requestFullscreen&&e.requestFullscreen(); else document.exitFullscreen(); }
document.getElementById('menuList').innerHTML = '<a onclick="goIdx(0)"><b>0</b>เริ่มต้น / วาระ</a><a onclick="goTopic(\'overview\')"><b>•</b>ภาพรวม: แผนที่ความเชื่อมโยง + ลำดับคิดเงิน</a>'+T.map(function(t){return '<a onclick="goTopic(\''+t.id+'\')"><b>'+t.no+'</b>'+t.name+' <span class="kbd">— '+t.short+'</span></a>';}).join('')+'<a onclick="goTopic(\'end\')"><b>✓</b>สรุปและข้อที่ต้องตัดสินใจ</a>';
document.addEventListener('keydown', function(e){
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ') { e.preventDefault(); go(1); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp') { e.preventDefault(); go(-1); }
  else if(e.key==='Home') show(0); else if(e.key==='End') show(S.length-1);
  else if(e.key==='m'||e.key==='M') toggleMenu(); else if(e.key==='f'||e.key==='F') fs(); else if(e.key==='Escape') closeMenu();
});
document.getElementById('stage').addEventListener('click', function(e){ if(e.target.closest('a,button')) return; var r=this.getBoundingClientRect(); if(e.clientX>r.left+r.width/2) go(1); else go(-1); });
var h = parseInt((location.hash||'').slice(1),10); show(isNaN(h)?0:h-1);
</script>
