<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สไลด์นำเสนอ — ระบบโปรโมชั่น คูปอง พอยท์ แคมเปญ สุ่มรางวัล เซตร้านยาเปิดใหม่</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap">
<style>
:root{--p:#B32026;--pd:#8A2622;--pl:#F5E8E8;--g1:#F5F5F5;--g2:#EEEEEE;--g3:#E0E0E0;--g5:#9E9E9E;--g6:#757575;--g8:#424242;--g9:#212121;--ok:#388E3C;--okl:#E8F5E8;--info:#1976D2;--infol:#E8F4FD;--warn:#F57C00;--warnl:#FFF8E1;--adm:#3949AB;--adml:#EEF0FF}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
body{font-family:"Noto Sans Thai",system-ui,sans-serif;color:var(--g8);background:#1b1b1b}
a{color:inherit}
#deck{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.stage{position:relative;width:min(100vw,177.78vh);height:min(100vh,56.25vw);background:#fff;overflow:hidden;font-size:clamp(11px,1.45vw,28px);line-height:1.5}
.slide{position:absolute;inset:0;padding:4.6% 5.5% 6%;display:none;flex-direction:column;animation:in .28s ease}
.slide.on{display:flex}
@keyframes in{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.bar{position:absolute;left:0;top:0;height:.45%;background:var(--p);transition:width .25s;z-index:5}
.foot{position:absolute;left:5.5%;right:5.5%;bottom:2.2%;display:flex;justify-content:space-between;font-size:.62em;color:var(--g5);z-index:4}
.tag{display:inline-block;font-weight:700;font-size:.6em;letter-spacing:.04em;color:var(--p);background:var(--pl);padding:.2em .9em;border-radius:999px;margin-bottom:.6em;align-self:flex-start}
.tag.a{color:var(--adm);background:var(--adml)}
h1{font-size:2.6em;line-height:1.2;margin:0 0 .3em;font-weight:800;color:var(--g9)}
h2{font-size:1.7em;line-height:1.25;margin:0 0 .4em;font-weight:800;color:var(--g9)}
h3{font-size:1em;margin:0 0 .25em;font-weight:700;color:var(--g9)}
p{margin:0 0 .6em}
.lead{font-size:1.05em;color:var(--g6)}
.cols{display:grid;gap:1.1em;min-height:0}.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(4,1fr)}
.card{background:#fff;border:1.5px solid var(--g3);border-radius:.9em;padding:.8em 1em}
.card.red{background:var(--pl);border-color:#D4A5A5}.card.blue{background:var(--infol);border-color:#90CAF9}.card.green{background:var(--okl);border-color:#A5D6A7}.card.amber{background:var(--warnl);border-color:#FFD180}.card.adm{background:var(--adml);border-color:#C5CAE9}
ul{margin:.2em 0 0;padding-left:1.15em}li{margin:.25em 0}
li b,p b{color:var(--g9)}
.chip{display:inline-flex;align-items:center;gap:.35em;border:1.5px solid var(--g3);background:#fff;border-radius:999px;padding:.12em .8em;font-size:.8em;font-weight:600;text-decoration:none;cursor:pointer;margin:.15em .25em .15em 0;color:var(--g8)}
.chip:hover{border-color:var(--p);color:var(--p)}
.chip.go{background:var(--p);color:#fff;border-color:var(--p)}.chip.go:hover{background:var(--pd);color:#fff}
.flow{display:flex;align-items:stretch;gap:.45em;flex-wrap:wrap}
.flow .n{flex:1;min-width:7em;border-radius:.8em;padding:.55em .75em;font-size:.88em;background:#fff;border:1.5px solid var(--g3);position:relative;text-decoration:none;cursor:pointer}
.flow .n b{display:block;color:var(--g9)}.flow .n.r{background:var(--pl);border-color:#D4A5A5}.flow .n.b{background:var(--infol);border-color:#90CAF9}.flow .n.g{background:var(--okl);border-color:#A5D6A7}
.flow .n:hover{border-color:var(--p)}
.flow .ar{align-self:center;color:var(--g5);font-weight:700}
.parts{display:grid;grid-template-columns:1fr 1fr;gap:1.2em;flex:1;align-content:center}
.part{border-radius:1em;padding:1em 1.2em;cursor:pointer;border:2px solid var(--g3);text-decoration:none;display:block}
.part:hover{transform:translateY(-2px);transition:.15s}
.part.a{background:var(--adml);border-color:#C5CAE9}.part.c{background:var(--pl);border-color:#D4A5A5}
.part .no{font-size:.72em;font-weight:800;letter-spacing:.05em}.part.a .no{color:var(--adm)}.part.c .no{color:var(--p)}
.part b{display:block;font-size:1.25em;color:var(--g9);margin:.1em 0 .3em}
.part .sub{font-size:.82em;color:var(--g6)}
.mini{display:flex;flex-wrap:wrap;gap:.3em;margin-top:.6em}.mini a{font-size:.72em;padding:.1em .7em;border-radius:999px;background:#fff;border:1px solid var(--g3);text-decoration:none;cursor:pointer}.mini a:hover{border-color:var(--p);color:var(--p)}
.mapgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5em;align-content:start;flex:1}
.mn{border-radius:.9em;border:1.5px solid var(--g3);padding:.6em .9em;font-size:.84em;display:flex;flex-direction:column;justify-content:center;cursor:pointer;text-decoration:none}
.mn b{font-size:1.08em;color:var(--g9)}.mn:hover{border-color:var(--p)}
.mn.base{background:var(--infol);border-color:#90CAF9;grid-column:span 3;flex-direction:row;gap:1em;align-items:center}
.mn.core{background:var(--p);color:#fff;border-color:var(--p);grid-column:span 3;text-align:center}.mn.core b{color:#fff}
.mn.after{background:var(--okl);border-color:#A5D6A7;flex-direction:row;gap:.6em;align-items:center;justify-content:center}
.dn{text-align:center;color:var(--g5);font-weight:700;grid-column:span 3;line-height:1;font-size:.85em}
/* part 1: capability cards */
.caps{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:.85em;flex:1;align-content:stretch;min-height:0;max-height:78%}
.cap{border:1.5px solid #C5CAE9;background:#fff;border-radius:.85em;padding:.65em .9em;display:flex;flex-direction:column}
.cap h3{color:var(--adm);font-size:.95em}
.cap p{margin:0;font-size:.88em;color:var(--g8)}
.cap .eg{margin-top:auto;padding-top:.4em;font-size:.72em;color:var(--g6)}
.cap .eg b{color:var(--g8)}
.intro{display:grid;grid-template-columns:1.1fr 1fr;gap:1.2em;flex:1;min-height:0;align-items:start}
.intro .rc{display:flex;flex-direction:column;gap:.8em;min-height:0;height:100%}
.intro .frame{flex:1;cursor:pointer}.intro .frame:hover{border-color:var(--p)}
.example{background:var(--warnl);border:1.5px solid #FFD180;border-radius:.9em;padding:.8em 1em}
.example h3{color:#8a5300}
/* part 2: screen slides */
.scr{display:grid;grid-template-columns:1.75fr 1fr;gap:1.2em;flex:1;min-height:0}
.frame{border-radius:.7em;border:1.5px solid var(--g3);box-shadow:0 .4em 1.4em rgba(0,0,0,.12);overflow:hidden;display:flex;flex-direction:column;min-height:0;background:#f4f4f4}
.frame .tb{display:flex;align-items:center;gap:.3em;padding:.3em .6em;background:var(--g2);font-size:.55em;color:var(--g6)}
.frame .tb i{width:.75em;height:.75em;border-radius:50%;background:#ccc;display:inline-block}
.frame .tb i:nth-child(1){background:#ef5350}.frame .tb i:nth-child(2){background:#ffca28}.frame .tb i:nth-child(3){background:#66bb6a}
.frame .tb span{margin-left:.6em;background:#fff;border-radius:.4em;padding:.05em .7em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frame img{width:100%;flex:1;min-height:0;object-fit:cover;object-position:top left;display:block}
.side{display:flex;flex-direction:column;min-height:0}
.side ol{margin:0;padding-left:1.2em;font-size:.88em}.side li{margin:.35em 0}
.side .why{margin-top:auto;font-size:.78em;background:var(--pl);border-radius:.7em;padding:.55em .8em;color:var(--pd)}
.step{display:flex;gap:.35em;flex-wrap:wrap;margin-bottom:.5em}
.step span{font-size:.62em;padding:.1em .65em;border-radius:999px;background:var(--g1);color:var(--g6);border:1px solid var(--g2)}
.step span.on{background:var(--p);color:#fff;border-color:var(--p)}
.divider{justify-content:center}
/* part 1: illustrated examples — set → works → shows */
.demo{display:grid;grid-template-columns:1fr auto 1fr auto 1.15fr;gap:.7em;flex:1;min-height:0;align-items:stretch}
.demo .arw{align-self:center;font-size:1.6em;color:var(--g5);font-weight:800}
.dcol{border-radius:.9em;padding:.75em .9em;display:flex;flex-direction:column;min-height:0;gap:.45em}
.dcol>.hd{font-size:.68em;font-weight:800;letter-spacing:.05em;display:flex;align-items:center;gap:.4em}
.dcol>.hd i{font-style:normal;width:1.6em;height:1.6em;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:.95em}
.dcol.set{background:var(--adml);border:1.5px solid #C5CAE9}.dcol.set>.hd{color:var(--adm)}.dcol.set>.hd i{background:var(--adm)}
.dcol.how{background:var(--warnl);border:1.5px solid #FFD180}.dcol.how>.hd{color:#8a5300}.dcol.how>.hd i{background:var(--warn)}
.dcol.see{background:var(--pl);border:1.5px solid #D4A5A5;justify-content:center}.dcol.see>.hd{position:absolute;top:.75em}.dcol.see{position:relative;padding-top:2.4em}.dcol.see>.hd{color:var(--pd)}.dcol.see>.hd i{background:var(--p)}
.cfg{background:#fff;border-radius:.7em;padding:.5em .7em;box-shadow:0 .15em .5em rgba(57,73,171,.12)}
.cfg .t{font-weight:800;color:var(--g9);font-size:1em;margin-bottom:.35em}
.cfg .r{display:flex;justify-content:space-between;gap:.5em;align-items:center;font-size:.86em;padding:.42em 0;border-top:1px dashed var(--g2)}
.cfg .r span{color:var(--g6);white-space:nowrap}
.cfg .r b{background:var(--adml);color:var(--adm);border-radius:.4em;padding:.05em .5em;font-weight:700;text-align:right}
.how ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.55em;counter-reset:h}
.how li{background:#fff;border-radius:.6em;padding:.55em .7em .55em 2.1em;font-size:.86em;position:relative;margin:0;counter-increment:h}
.how li:before{content:counter(h);position:absolute;left:.55em;top:.45em;width:1.2em;height:1.2em;border-radius:50%;background:var(--warn);color:#fff;font-size:.85em;font-weight:800;display:flex;align-items:center;justify-content:center}
.where{display:flex;flex-wrap:wrap;gap:.3em;margin-top:auto;align-items:center}.where em{font-style:normal;font-size:.7em;font-weight:800;color:#8a5300;width:100%}
.where span{font-size:.72em;font-weight:700;background:#fff;border:1px solid #D4A5A5;color:var(--pd);border-radius:999px;padding:.1em .6em}
.where.w2 span{border-color:#FFD180;color:#8a5300}
/* mini customer-side illustrations (drawn, not screenshots) */
.mk{background:#fff;border-radius:.7em;padding:.6em .8em;box-shadow:0 .15em .6em rgba(0,0,0,.08);font-size:.84em}
.mk .lbl{font-size:.82em;color:var(--g5);margin-bottom:.3em}
.pc{display:flex;gap:.6em;align-items:center}
.pc .im{width:3.2em;height:3.2em;border-radius:.5em;background:var(--g1);display:flex;align-items:center;justify-content:center;font-size:1.5em;flex:none}
.pc b{display:block;color:var(--g9)}
.tg{display:inline-block;font-size:.8em;font-weight:700;border-radius:.35em;padding:.05em .45em;color:#fff;margin:.15em .2em 0 0}
.tg.r{background:var(--p)}.tg.g{background:var(--ok)}.tg.b{background:var(--info)}.tg.o{background:var(--warn)}.tg.gr{background:var(--g5)}.tg.pu{background:#7B1FA2}
.ln{display:flex;justify-content:space-between;padding:.25em 0;border-top:1px solid var(--g2)}
.ln.free{color:var(--ok);font-weight:700}.ln.disc{color:var(--p);font-weight:700}.ln.tot{font-weight:800;color:var(--g9);border-top:2px solid var(--g3)}
.nudge{background:var(--warnl);border-radius:.4em;padding:.25em .5em;margin-top:.35em;color:#8a5300;font-weight:600}
.tk{display:flex;border:1.5px dashed #D4A5A5;border-radius:.6em;overflow:hidden;background:#fff}
.tk .l{flex:1;padding:.45em .6em}.tk .l b{color:var(--g9);display:block}
.tk .r{width:4.4em;background:var(--pl);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;color:var(--p);border-left:1.5px dashed #D4A5A5}
.tk .r .bt{margin-top:.2em;background:var(--p);color:#fff;border-radius:.35em;padding:.05em .55em;font-size:.8em}
.pb{height:.45em;background:var(--g2);border-radius:999px;overflow:hidden;margin:.3em 0}.pb i{display:block;height:100%;background:var(--p)}
.lad{position:relative;height:4em;margin:.5em 1em 0}
.lad .rail{position:absolute;left:0;right:0;top:1.4em;height:.45em;background:var(--g2);border-radius:999px}
.lad .fill{position:absolute;left:0;top:1.4em;height:.45em;background:var(--ok);border-radius:999px}
.lad .st{position:absolute;top:.95em;transform:translateX(-50%);text-align:center;font-size:.78em;white-space:nowrap}
.lad .st i{display:block;margin:0 auto .2em;width:1.3em;height:1.3em;border-radius:50%;background:#fff;border:2px solid var(--g3);font-style:normal;line-height:1.05em;font-size:.85em}
.lad .st.ok i{background:var(--ok);border-color:var(--ok);color:#fff}.lad .st.now i{background:var(--p);border-color:var(--p);color:#fff}
.lad .you{position:absolute;top:-.2em;transform:translateX(-50%);font-size:.75em;font-weight:800;color:var(--p);white-space:nowrap}
.kit .ln span:first-child:before{margin-right:.3em}
.kit .lock:before{content:"🔒"}.kit .on:before{content:"✅"}.kit .off:before{content:"⬜"}.kit .off{color:var(--g5)}
.grp{display:flex;flex-wrap:wrap;gap:.25em;margin-top:.3em}.grp span{background:var(--infol);color:var(--info);border-radius:999px;padding:.05em .55em;font-size:.85em;font-weight:600}
.cnt{display:inline-flex;gap:.2em}.cnt b{background:var(--g9);color:#fff;border-radius:.3em;padding:0 .35em}
.paper{display:grid;grid-template-columns:1fr 1fr;gap:.4em}.paper div{border:1.5px solid var(--g3);border-radius:.5em;padding:.4em .5em;font-size:.9em;background:#fff}
.paper .fr{background:linear-gradient(135deg,#B32026,#8A2622);color:#fff;border-color:transparent}.paper .fr b{font-size:1.6em;display:block;line-height:1.1}
.divider h1{font-size:2.4em}
.nav{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:6px;z-index:20;opacity:.0;transition:.2s}
body:hover .nav{opacity:1}
.nav button{border:0;background:rgba(0,0,0,.72);color:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;font-family:inherit;font-size:13px}
.nav button:hover{background:var(--p)}
.menu{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;display:none;align-items:center;justify-content:center}.menu.on{display:flex}
.menu .box{background:#fff;border-radius:16px;padding:18px 22px;width:min(820px,92vw);max-height:86vh;overflow:auto;font-size:14px}
.menu h4{margin:12px 0 6px;font-size:15px}.menu h4:first-child{margin-top:0}.menu a{display:block;padding:6px 10px;border-radius:8px;text-decoration:none;cursor:pointer}.menu a:hover{background:var(--pl)}.menu a b{color:var(--p);margin-right:8px}
.kbd{font-size:.68em;color:var(--g5)}
@media print{body{overflow:visible}.slide{display:flex!important;position:relative;page-break-after:always;height:100vh}.nav,.menu{display:none}}
</style>
</head>
<body>
<div id="deck"><div class="stage" id="stage"><div class="bar" id="bar"></div><div id="slides"></div><div class="foot"><span id="ft">Pharmaplex · ระบบโปรโมชั่นและสิทธิพิเศษ</span><span id="pg"></span></div></div></div>
<div class="nav"><button onclick="go(-1)">◀ ก่อนหน้า</button><button onclick="toggleMenu()">☰ สารบัญ (M)</button><button onclick="go(1)">ถัดไป ▶</button><button onclick="fs()">เต็มจอ (F)</button></div>
<div class="menu" id="menu" onclick="if(event.target===this)toggleMenu()"><div class="box" id="menuList"></div></div>

<script>
var MK = '../mockup/';
/* ======================================================================
   PART 1 — what the shop's team can set up (plain language, no admin UI)
   ====================================================================== */
var T = [
 { id:'foundation', no:'1', name:'กลุ่มลูกค้า · กลุ่มสินค้า', short:'ตั้งครั้งเดียว ใช้ได้ทุกเรื่อง',
   lead:'ข้อมูลกลางที่ตั้งไว้ครั้งเดียว แล้วหยิบไปใช้ได้กับทุกเรื่อง — ไม่ต้องคีย์รายชื่อร้านหรือรายการสินค้าซ้ำทุกครั้งที่ทำโปรใหม่',
   idea:['<b>กลุ่มลูกค้า</b> รวมร้าน/สาขาที่ต้องการให้สิทธิ์พิเศษไว้เป็นชุด','<b>กลุ่มสินค้า</b> รวมแบรนด์ หมวด หรือรายสินค้าไว้เป็นชุด','ทุกเรื่องเลือกได้ว่าให้ <b>ทุกคน</b> หรือ <b>เฉพาะบางกลุ่ม</b> — หน้าตาเหมือนกันทุกที่','ของรางวัลทุกเรื่องเลือกจาก <b>รายการเดียวกัน</b> เรียนครั้งเดียวใช้ได้หมด'],
   example:'สร้างกลุ่ม “ร้านยาภาคเหนือ” ไว้ครั้งเดียว แล้วใช้ได้ทั้งคูปองเฉพาะกลุ่ม โปรโมชั่น และกิจกรรมสุ่มรางวัล',
   caps:[
    ['กลุ่มลูกค้า','เลือกร้านเองทีละราย หรือนำเข้าจากไฟล์ Excel / CSV เพิ่ม-ลบสมาชิกได้ตลอด','ตัวอย่าง: <b>ร้านคู่ค้า VIP 120 ร้าน</b>'],
    ['กลุ่มสินค้า','เลือกทั้งแบรนด์ ทั้งหมวด หรือรายสินค้า และยกเว้นบางรายการได้','ตัวอย่าง: <b>Blackmores ทั้งแบรนด์ ยกเว้นสูตรคนท้อง</b>'],
    ['ใครได้สิทธิ์','ทุกเรื่องตั้งได้ว่าให้ทุกคน หรือเฉพาะกลุ่มลูกค้าที่เลือก','ตัวอย่าง: <b>โปรนี้เฉพาะร้าน B2B</b>'],
    ['ของรางวัลที่ให้ได้','ของแถม · ส่วนลด · พอยท์ · คูปอง · เครดิตเงินคืน · สิทธิ์ลุ้น · ของรางวัลนอกระบบ (เช่น ทริป) · ส่งฟรี','ผสมหลายอย่างในรางวัลเดียวได้']] },
 { id:'promotion', no:'2', name:'โปรโมชั่น', short:'ส่วนลด/ของแถมที่เกิดเอง ไม่ต้องใส่โค้ด',

/* ---------- engine ---------- */
var cur = 0, host = document.getElementById('slides');
host.innerHTML = S.map(function(s,i){ return '<section class="slide" id="s'+i+'">'+s.html+'</section>'; }).join('');
function show(i){
  cur = Math.max(0, Math.min(S.length-1, i));
  Array.prototype.forEach.call(host.children, function(el,k){ el.classList.toggle('on', k===cur); });
  document.getElementById('bar').style.width = ((cur+1)/S.length*100)+'%';
  document.getElementById('pg').textContent = (cur+1)+' / '+S.length;
  document.getElementById('ft').textContent = 'Pharmaplex · '+(S[cur].title||'');
  history.replaceState(null,'','#'+(cur+1));
}
function go(d){ show(cur+d); }
function goKey(k){ show(mark[k]!==undefined?mark[k]:0); closeMenu(); }
function toggleMenu(){ document.getElementById('menu').classList.toggle('on'); }
function closeMenu(){ document.getElementById('menu').classList.remove('on'); }
function fs(){ var e=document.documentElement; if(!document.fullscreenElement) e.requestFullscreen&&e.requestFullscreen(); else document.exitFullscreen(); }
document.getElementById('menuList').innerHTML =
 '<h4>เริ่มต้น</h4><a onclick="goKey(\'start\')"><b>•</b>หน้าแรก / วาระ</a><a onclick="goKey(\'overview\')"><b>•</b>ภาพรวม: ความเชื่อมโยง + ลำดับคิดเงิน</a>'+
 '<h4>ส่วนที่ 1 · ทีมงานตั้งค่าอะไรได้บ้าง</h4>'+T.map(function(t){return '<a onclick="goKey(\'t-'+t.id+'\')"><b>'+t.no+'</b>'+t.name+' <span class="kbd">— '+t.short+'</span></a>';}).join('')+
 '<h4>ส่วนที่ 2 · ลูกค้าของคุณจะเห็นอะไร</h4>'+J.map(function(j){return '<a onclick="goKey(\'j-'+j.key+'\')"><b>'+j.stage+'</b>'+j.title+'</a>';}).join('')+
 '<h4>ปิดท้าย</h4><a onclick="goKey(\'end\')"><b>✓</b>สรุปและข้อที่อยากให้ช่วยยืนยัน</a>';
document.addEventListener('keydown', function(e){
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ') { e.preventDefault(); go(1); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp') { e.preventDefault(); go(-1); }
  else if(e.key==='Home') show(0); else if(e.key==='End') show(S.length-1);
  else if(e.key==='m'||e.key==='M') toggleMenu(); else if(e.key==='f'||e.key==='F') fs(); else if(e.key==='Escape') closeMenu();
});
document.getElementById('stage').addEventListener('click', function(e){ if(e.target.closest('a,button')) return; var r=this.getBoundingClientRect(); if(e.clientX>r.left+r.width/2) go(1); else go(-1); });
var h = parseInt((location.hash||'').slice(1),10); show(isNaN(h)?0:h-1);
</script>
