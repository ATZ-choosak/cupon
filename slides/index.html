<title>สไลด์นำเสนอ — ระบบโปรโมชั่น คูปอง พอยท์ แคมเปญ สุ่มรางวัล เซตร้านยาเปิดใหม่</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap">
<style>
:root{--p:#B32026;--pd:#8A2622;--pl:#F5E8E8;--g1:#F5F5F5;--g2:#EEEEEE;--g3:#E0E0E0;--g5:#9E9E9E;--g6:#757575;--g8:#424242;--g9:#212121;--ok:#388E3C;--okl:#E8F5E8;--info:#1976D2;--infol:#E8F4FD;--warn:#F57C00;--warnl:#FFF8E1}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
body{font-family:"Noto Sans Thai",system-ui,sans-serif;color:var(--g8);background:#1b1b1b}
a{color:inherit}
#deck{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.stage{position:relative;width:min(100vw,177.78vh);height:min(100vh,56.25vw);background:#fff;overflow:hidden;font-size:clamp(11px,1.45vw,28px);line-height:1.5}
.slide{position:absolute;inset:0;padding:5.2% 6% 6.5%;display:none;flex-direction:column;animation:in .28s ease}
.slide.on{display:flex}
@keyframes in{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.bar{position:absolute;left:0;top:0;height:.45%;background:var(--p);transition:width .25s;z-index:5}
.foot{position:absolute;left:6%;right:6%;bottom:2.2%;display:flex;justify-content:space-between;font-size:.62em;color:var(--g5);z-index:4}
.tag{display:inline-block;font-weight:700;font-size:.6em;letter-spacing:.06em;color:var(--p);background:var(--pl);padding:.2em .9em;border-radius:999px;margin-bottom:.7em;align-self:flex-start}
h1{font-size:2.7em;line-height:1.2;margin:0 0 .3em;font-weight:800;color:var(--g9)}
h2{font-size:1.85em;line-height:1.25;margin:0 0 .5em;font-weight:800;color:var(--g9)}
h3{font-size:1.05em;margin:0 0 .35em;font-weight:700;color:var(--g9)}
p{margin:0 0 .6em}
.lead{font-size:1.15em;color:var(--g6)}
.cols{display:grid;gap:1.4em;flex:1;min-height:0}.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(4,1fr)}
.card{background:#fff;border:1.5px solid var(--g3);border-radius:.9em;padding:.9em 1.1em}
.card.red{background:var(--pl);border-color:#D4A5A5}.card.blue{background:var(--infol);border-color:#90CAF9}.card.green{background:var(--okl);border-color:#A5D6A7}.card.amber{background:var(--warnl);border-color:#FFD180}
ul{margin:.2em 0 0;padding-left:1.15em}li{margin:.28em 0}
li b,p b{color:var(--g9)}
.big{font-size:3em;font-weight:800;color:var(--p);line-height:1}
.chip{display:inline-flex;align-items:center;gap:.35em;border:1.5px solid var(--g3);background:#fff;border-radius:999px;padding:.12em .8em;font-size:.82em;font-weight:600;text-decoration:none;cursor:pointer;margin:.15em .25em .15em 0;color:var(--g8)}

.topic{border:1.5px solid var(--g3);border-radius:.9em;padding:.8em 1em;cursor:pointer;background:#fff;transition:.15s;text-decoration:none;display:block}

.nav button:hover{background:var(--p)}
.menu{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;display:none;align-items:center;justify-content:center}.menu.on{display:flex}
.menu .box{background:#fff;border-radius:16px;padding:18px 22px;width:min(760px,92vw);max-height:86vh;overflow:auto;font-size:14px}
.menu h4{margin:0 0 10px;font-size:18px}.menu a{display:block;padding:7px 10px;border-radius:8px;text-decoration:none}.menu a:hover{background:var(--pl)}.menu a b{color:var(--p);margin-right:8px}
.kbd{font-size:.7em;color:var(--g5)}
.shots{display:grid;grid-template-columns:1fr 1fr;gap:1em;flex:1;min-height:0;margin-bottom:.7em}
.shot{display:flex;flex-direction:column;border:1.5px solid var(--g3);border-radius:.8em;overflow:hidden;text-decoration:none;min-height:0;background:#fff;transition:.15s}

.shot span{padding:.3em .8em;font-size:.78em;font-weight:700;background:var(--g1);color:var(--g8)}
.demo{display:grid;grid-template-columns:1.15fr 1fr;gap:1.4em;flex:1;min-height:0}
.steps{list-style:none;margin:0;padding:0;counter-reset:st}
.steps li{counter-increment:st;position:relative;padding:.55em .8em .55em 2.6em;margin:.4em 0;border:1.5px solid var(--g3);border-radius:.8em;background:#fff}
.steps li::before{content:counter(st);position:absolute;left:.6em;top:50%;transform:translateY(-50%);width:1.5em;height:1.5em;border-radius:50%;background:var(--p);color:#fff;font-weight:800;font-size:.8em;display:flex;align-items:center;justify-content:center}

.dbtn.alt{background:#fff;color:var(--p);border:2px solid var(--p)}.dbtn.alt:hover{background:var(--pl)}

/* ---------- engine ---------- */
var cur = 0, host = document.getElementById('slides');
host.innerHTML = S.map(function(s,i){ return '<section class="slide" id="s'+i+'">'+s.html+'</section>'; }).join('');
function show(i){
  cur = Math.max(0, Math.min(S.length-1, i));
  Array.prototype.forEach.call(host.children, function(el,k){ el.classList.toggle('on', k===cur); });
  document.getElementById('bar').style.width = ((cur+1)/S.length*100)+'%';
  document.getElementById('pg').textContent = (cur+1)+' / '+S.length;
  document.getElementById('ft').textContent = 'Pharmaplex · '+(S[cur].title||'');
  history.replaceState(null,'','#'+(cur+1));
}
function go(d){ show(cur+d); }
function goIdx(i){ show(i); closeMenu(); }
function goTopic(id){ show(topicStart[id] !== undefined ? topicStart[id] : 0); closeMenu(); }
function toggleMenu(){ document.getElementById('menu').classList.toggle('on'); }
function closeMenu(){ document.getElementById('menu').classList.remove('on'); }
function fs(){ var e=document.documentElement; if(!document.fullscreenElement) e.requestFullscreen&&e.requestFullscreen(); else document.exitFullscreen(); }
document.getElementById('menuList').innerHTML = '<a onclick="goIdx(0)"><b>0</b>เริ่มต้น / วาระ</a><a onclick="goTopic(\'overview\')"><b>•</b>ภาพรวม: แผนที่ความเชื่อมโยง + ลำดับคิดเงิน</a>'+T.map(function(t){return '<a onclick="goTopic(\''+t.id+'\')"><b>'+t.no+'</b>'+t.name+' <span class="kbd">— '+t.short+'</span></a>';}).join('')+'<a onclick="goTopic(\'end\')"><b>✓</b>สรุปและข้อที่ต้องตัดสินใจ</a>';
document.addEventListener('keydown', function(e){
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ') { e.preventDefault(); go(1); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp') { e.preventDefault(); go(-1); }
  else if(e.key==='Home') show(0); else if(e.key==='End') show(S.length-1);
  else if(e.key==='m'||e.key==='M') toggleMenu(); else if(e.key==='f'||e.key==='F') fs(); else if(e.key==='Escape') closeMenu();
});
document.getElementById('stage').addEventListener('click', function(e){ if(e.target.closest('a,button')) return; var r=this.getBoundingClientRect(); if(e.clientX>r.left+r.width/2) go(1); else go(-1); });
var h = parseInt((location.hash||'').slice(1),10); show(isNaN(h)?0:h-1);
</script>
